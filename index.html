<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avun — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1B1F3A;--ink:#EDE7DC;--muted:#B9B5CF;--accent:#F2A65A;--line:rgba(237,231,220,0.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0E1022;color:var(--ink);font-family:Manrope,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--bg);overflow:hidden;touch-action:none}
canvas#scene{position:absolute;inset:0;width:100%;height:100%;display:block;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(28px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom))}
.screen.on{display:flex}
.fade{animation:fadeIn .6s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.brand{font-size:22px;font-weight:700;letter-spacing:.08em}
button,.btn{font-family:inherit;cursor:pointer}
.big{width:100%;height:64px;border-radius:32px;border:0;background:var(--accent);color:#1B1F3A;font-size:20px;font-weight:700}
.ghost{height:48px;padding:0 22px;border-radius:24px;background:rgba(20,23,44,.58);border:1px solid rgba(237,231,220,.28);color:var(--ink);font-size:16px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.icon{width:48px;height:48px;border-radius:24px;border:1px solid var(--line);background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.muted{color:var(--muted)}
/* splash */
#splash .msg{margin-top:auto;margin-bottom:auto}
#splash .l1{font-size:28px;font-weight:500;color:var(--muted);margin:0 0 10px}
#splash .l2{font-size:52px;font-weight:700;margin:0;animation:rise .9s ease-out 1s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{width:120px;height:3px;border-radius:2px;background:#2E3358;margin-top:28px;overflow:hidden}
.bar i{display:block;height:3px;background:var(--accent);animation:fill 5s linear both}
@keyframes fill{from{width:0}to{width:100%}}
@media (prefers-reduced-motion:reduce){#splash .l2,.bar i,.fade{animation:none}}
/* theme picker */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}
.card{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#232849;color:var(--ink);text-align:left;padding:0;display:flex;flex-direction:column}
.card canvas{width:100%;height:150px;display:block}
.card span{display:block;padding:10px 14px 0;font-size:17px;font-weight:700}
.card small{display:block;padding:2px 14px 12px;font-size:13px;color:var(--muted);line-height:1.35}
/* dial */
.dialwrap{position:relative;width:260px;height:260px;margin:0 auto}
.dialnum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dialnum b{font-size:92px;font-weight:600;line-height:1}
.presets{display:flex;gap:10px;justify-content:center}
.preset{width:56px;height:48px;border-radius:24px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:17px;font-weight:600}
.preset.sel{background:var(--accent);border-color:var(--accent);color:#1B1F3A;font-weight:700}
.themes{display:flex;align-items:center;gap:14px;justify-content:center}
.tdot{width:48px;height:48px;border-radius:24px;border:1px solid var(--line);padding:0}
.tdot.sel{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
/* immersion */
#imm{padding:0;background:transparent}
#imm .controls{position:absolute;left:24px;right:24px;bottom:calc(36px + env(safe-area-inset-bottom));display:flex;justify-content:space-between}
#hint{position:absolute;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:4px;padding:8px 18px;border-radius:20px;background:rgba(20,23,44,.58);color:#F7C08A;border:0;font-size:14px;font-weight:600}
#hint.on{display:flex;animation:fadeIn .8s ease both}
#peekbox{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);padding:18px 30px;border-radius:20px;background:rgba(20,23,44,.82);border:1px solid rgba(237,231,220,.2);text-align:center;display:none}
#peekbox.on{display:block;animation:fadeIn .25s ease both}
#peekbox b{font-size:34px;font-weight:700}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:28px 24px calc(32px + env(safe-area-inset-bottom));background:rgba(20,23,44,.92);border-radius:28px 28px 0 0;display:flex;flex-direction:column;align-items:center;gap:14px}
#confirm{display:none;position:absolute;inset:0;background:rgba(10,12,26,.45)}
#confirm.on{display:block}
#confirm .row{display:flex;gap:12px;width:100%}
#confirm .row button{flex:1}
/* arrived */
#arr{padding:0;background:transparent}
#arr .sheet{animation:fadeIn 1s ease both}
#arr h1{margin:0;font-size:44px;font-weight:700;line-height:1.1}
/* settings */
#set .opt{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:17px}
.toggle{width:56px;height:32px;border-radius:16px;border:1px solid var(--line);background:#2E3358;position:relative}
.toggle[aria-pressed="true"]{background:var(--accent)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:var(--ink);transition:left .2s}
.toggle[aria-pressed="true"]::after{left:27px}
.langs{display:flex;flex-wrap:wrap;gap:8px;padding:14px 0}
.lang{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:15px}
.lang.sel{background:var(--accent);color:#1B1F3A;border-color:var(--accent);font-weight:700}
#dbg{position:absolute;left:8px;top:8px;font:12px/1.4 ui-monospace,monospace;color:#9FE;background:rgba(0,0,0,.5);padding:6px 8px;border-radius:8px;display:none;pointer-events:none;white-space:pre}
</style>
</head>
<body>
<div id="app">
<canvas id="scene" aria-hidden="true"></canvas>

<section id="splash" class="screen" aria-label="Opening message">
  <span class="brand">avun</span>
  <div class="msg"><p class="l1" data-t="s1"></p><p class="l2" data-t="s2"></p><div class="bar"><i></i></div></div>
  <span class="muted" style="font-size:14px" data-t="skip"></span>
</section>

<section id="pick" class="screen" aria-label="Pick a theme" style="overflow:auto">
  <span class="brand">avun</span>
  <h1 style="margin:18px 0 6px;font-size:27px;line-height:1.2" data-t="pickT"></h1>
  <p class="muted" style="margin:0;font-size:15px" data-t="pickS"></p>
  <div class="grid" id="cards"></div>
</section>

<section id="dial" class="screen" aria-label="Choose a duration">
  <div style="display:flex;justify-content:space-between;align-items:center;height:48px">
    <span class="brand">avun</span>
    <button class="icon" id="gear" data-l="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:30px">
    <div class="dialwrap">
      <svg width="260" height="260" viewBox="0 0 280 280" aria-hidden="true"><circle cx="140" cy="140" r="120" fill="none" stroke="#2E3358" stroke-width="14"/><circle id="arc" cx="140" cy="140" r="120" fill="none" stroke="#F2A65A" stroke-width="14" stroke-linecap="round" stroke-dasharray="126 754" transform="rotate(-90 140 140)"/></svg>
      <div class="dialnum"><b id="mins">10</b><span class="muted" style="font-size:18px;margin-top:6px" data-t="minutes"></span></div>
    </div>
    <div class="presets" role="group" id="presets"></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:18px;align-items:center">
    <div class="themes"><span class="muted" style="font-size:14px" data-t="theme"></span><span id="tdots" style="display:flex;gap:12px"></span></div>
    <button class="big" id="start" data-t="start"></button>
    <p class="muted" style="margin:0;font-size:14px;line-height:1.5;text-align:center;max-width:300px" data-t="tag"></p>
  </div>
</section>

<section id="imm" class="screen" aria-label="Session">
  <button id="hint"><svg width="22" height="14" viewBox="0 0 22 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 L11 3 L19 11"/></svg><span data-t="swipe"></span></button>
  <div id="peekbox" role="status"><b id="peektext"></b></div>
  <div class="controls">
    <button class="ghost" id="peek"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span data-t="peek"></span></button>
    <button class="ghost" id="end" data-t="end"></button>
  </div>
  <div id="confirm"><div class="sheet"><p style="margin:0 0 6px;font-size:24px;font-weight:700" data-t="endQ"></p><div class="row"><button class="ghost" style="justify-content:center" id="keep" data-t="keep"></button><button class="big" style="height:48px;font-size:17px" id="endnow" data-t="endNow"></button></div></div></div>
</section>

<section id="arr" class="screen" aria-label="Session finished">
  <div class="sheet">
    <h1 id="passed"></h1>
    <p class="muted" style="margin:0 0 8px;font-size:17px" data-t="still"></p>
    <button class="big" id="again"></button>
    <button class="ghost" style="background:transparent;border:0" id="done" data-t="done"></button>
  </div>
</section>

<section id="set" class="screen" aria-label="Settings">
  <div style="display:flex;justify-content:space-between;align-items:center;height:48px"><span style="font-size:22px;font-weight:700" data-t="settings"></span><button class="icon" id="closeSet" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="opt"><span data-t="sound"></span><button class="toggle" id="tSound" aria-pressed="true" data-l="sound"></button></div>
  <div class="opt"><span data-t="vibration"></span><button class="toggle" id="tVib" aria-pressed="true" data-l="vibration"></button></div>
  <div class="opt" style="border:0;padding-bottom:0"><span data-t="language"></span></div>
  <div class="langs" id="langs"></div>
</section>
<div id="dbg"></div>
</div>

<script>
(function(){
"use strict";
// ---------- text (from the five-language sheet) ----------
var T={
en:{s1:"The feed never ends.",s2:"This does.",skip:"Tap anywhere to skip",pickT:"What would you like to look at?",pickS:"Pick one. You can change it anytime.",village:"Village",villageL:"Hills, a lit window, smoke rising",window:"Window",windowL:"A landscape gliding past",sea:"Sea at night",seaL:"Moonlight and glittering waves",graphic:"Graphic",graphicL:"Bold shapes, a flowing flock",minutes:"minutes",start:"Start",theme:"Theme",tag:"You can’t control the wait. You can control the next 10 minutes.",settings:"Settings",peek:"Peek",end:"End",left:function(n){return n+" min left"},lessMin:"Less than a minute left",swipe:"Swipe up for more",endQ:"End now?",keep:"Keep going",endNow:"End now",passed:function(s){return s+" passed."},still:"Still waiting?",again:function(n){return "Again · "+n+" min"},done:"Done",sound:"Sound",vibration:"Vibration",language:"Language"},
tr:{s1:"Akış hiç bitmez.",s2:"Bu biter.",skip:"Geçmek için herhangi bir yere dokunun",pickT:"Neye bakmak istersiniz?",pickS:"Birini seçin. İstediğiniz zaman değiştirebilirsiniz.",village:"Köy",villageL:"Tepeler, ışığı yanan bir pencere, yükselen duman",window:"Pencere",windowL:"Akıp giden bir manzara",sea:"Gece denizi",seaL:"Ay ışığı ve yakamozlu dalgalar",graphic:"Grafik",graphicL:"Cesur biçimler, akıp giden bir kuş sürüsü",minutes:"dakika",start:"Başla",theme:"Tema",tag:"Beklemeyi kontrol edemezsiniz. Sonraki 10 dakikayı edebilirsiniz.",settings:"Ayarlar",peek:"Göz at",end:"Bitir",left:function(n){return n+" dk kaldı"},lessMin:"1 dakikadan az kaldı",swipe:"Devamı için yukarı kaydırın",endQ:"Şimdi bitirilsin mi?",keep:"Devam et",endNow:"Şimdi bitir",passed:function(s){return s+" geçti."},still:"Hâlâ bekliyor musunuz?",again:function(n){return "Tekrar · "+n+" dk"},done:"Tamam",sound:"Ses",vibration:"Titreşim",language:"Dil"},
de:{s1:"Der Feed endet nie.",s2:"Das hier schon.",skip:"Zum Überspringen irgendwo tippen",pickT:"Was möchtest du dir ansehen?",pickS:"Wähl eins aus. Du kannst es jederzeit ändern.",village:"Dorf",villageL:"Hügel, ein erleuchtetes Fenster, aufsteigender Rauch",window:"Fenster",windowL:"Eine vorbeiziehende Landschaft",sea:"Meer bei Nacht",seaL:"Mondlicht und glitzernde Wellen",graphic:"Grafik",graphicL:"Kräftige Formen, ein fließender Schwarm",minutes:"Minuten",start:"Start",theme:"Thema",tag:"Das Warten kannst du nicht steuern. Die nächsten 10 Minuten schon.",settings:"Einstellungen",peek:"Kurz schauen",end:"Beenden",left:function(n){return "Noch "+n+" Min."},lessMin:"Weniger als eine Minute",swipe:"Für mehr nach oben wischen",endQ:"Jetzt beenden?",keep:"Weitermachen",endNow:"Jetzt beenden",passed:function(s){return s+" sind vergangen."},still:"Wartest du noch?",again:function(n){return "Nochmal · "+n+" Min."},done:"Fertig",sound:"Ton",vibration:"Vibration",language:"Sprache"},
fr:{s1:"Le fil ne s’arrête jamais.",s2:"Celui-ci, si.",skip:"Touchez n’importe où pour passer",pickT:"Que voulez-vous regarder ?",pickS:"Choisissez-en un. Vous pourrez le changer à tout moment.",village:"Village",villageL:"Des collines, une fenêtre éclairée, de la fumée",window:"Fenêtre",windowL:"Un paysage qui défile",sea:"Mer de nuit",seaL:"Clair de lune et vagues scintillantes",graphic:"Graphique",graphicL:"Des formes franches, une nuée qui ondule",minutes:"minutes",start:"Commencer",theme:"Thème",tag:"Vous ne maîtrisez pas l’attente. Les 10 prochaines minutes, si.",settings:"Réglages",peek:"Coup d’œil",end:"Terminer",left:function(n){return "Encore "+n+" min"},lessMin:"Moins d’une minute",swipe:"Balayez vers le haut pour la suite",endQ:"Terminer maintenant ?",keep:"Continuer",endNow:"Terminer",passed:function(s){return s+" écoulées."},still:"Vous attendez encore ?",again:function(n){return "Encore · "+n+" min"},done:"Terminé",sound:"Son",vibration:"Vibration",language:"Langue"},
bg:{s1:"Лентата никога не свършва.",s2:"Това – да.",skip:"Докоснете където и да е, за да пропуснете",pickT:"Какво бихте искали да гледате?",pickS:"Изберете една. Можете да я смените по всяко време.",village:"Село",villageL:"Хълмове, светнал прозорец, издигащ се дим",window:"Прозорец",windowL:"Пейзаж, който се плъзга покрай вас",sea:"Море нощем",seaL:"Лунна светлина и блещукащи вълни",graphic:"Графика",graphicL:"Смели форми, течащо ято",minutes:"минути",start:"Старт",theme:"Тема",tag:"Не можете да контролирате чакането. Следващите 10 минути – да.",settings:"Настройки",peek:"Надникни",end:"Край",left:function(n){return "Остават "+n+" мин"},lessMin:"По-малко от минута",swipe:"Плъзнете нагоре за още",endQ:"Да приключим ли сега?",keep:"Продължи",endNow:"Приключи сега",passed:function(s){return "Изминаха "+s+"."},still:"Още ли чакате?",again:function(n){return "Отново · "+n+" мин"},done:"Готово",sound:"Звук",vibration:"Вибрация",language:"Език"}
};
var LANGS=[["en","English"],["tr","Türkçe"],["de","Deutsch"],["fr","Français"],["bg","Български"]];
var THEMES=["village","window","sea","graphic"];
var PRESETS=[5,10,20,30,60];

// ---------- storage (optional) ----------
function load(k,d){try{var v=localStorage.getItem("avun."+k);return v===null?d:JSON.parse(v);}catch(e){return d;}}
function save(k,v){try{localStorage.setItem("avun."+k,JSON.stringify(v));}catch(e){}}

var hashFast=(location.hash==="#fast");     // test mode: time runs 10x faster
var SPEED=hashFast?10:1;
var nav=(navigator.language||"en").slice(0,2).toLowerCase();
var S={lang:load("lang",T[nav]?nav:"en"),theme:load("theme","village"),mins:load("mins",10),sound:load("sound",true),vib:load("vib",true),seen:load("seen",false)};

function tx(k){return T[S.lang][k];}
function applyText(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll("[data-t]").forEach(function(el){var v=tx(el.getAttribute("data-t"));if(typeof v==="string")el.textContent=v;});
  document.querySelectorAll("[data-l]").forEach(function(el){el.setAttribute("aria-label",tx(el.getAttribute("data-l")));});
  buildCards();buildDots();buildLangs();
}

// ---------- screens ----------
var dbg=document.getElementById("dbg");var app=document.getElementById("app"),cv=document.getElementById("scene"),cx=cv.getContext("2d");
var screens=["splash","pick","dial","imm","arr","set"];
var mode="dial";
function show(id){if(hashFast)dbg.style.display=(id==="imm")?"block":"none";screens.forEach(function(s){var el=document.getElementById(s);el.classList.toggle("on",s===id);});mode=id;cv.style.display=(id==="imm"||id==="arr")?"block":"none";}

// ---------- dial ----------
function setMins(m){S.mins=m;save("mins",m);document.getElementById("mins").textContent=m;var frac=Math.min(1,m/60);document.getElementById("arc").setAttribute("stroke-dasharray",(754*frac).toFixed(0)+" 754");
  document.querySelectorAll(".preset").forEach(function(b){var on=+b.dataset.m===m;b.classList.toggle("sel",on);b.setAttribute("aria-pressed",on?"true":"false");});}
(function(){var box=document.getElementById("presets");PRESETS.forEach(function(m){var b=document.createElement("button");b.className="preset";b.dataset.m=m;b.textContent=m;b.onclick=function(){setMins(m);};box.appendChild(b);});})();
var DOTC={village:["#2B3156","#F4B860"],window:["#F5C99A","#A86E58"],sea:["#12243D","#6FE3D2"],graphic:["#14142B","#FF6B4A"]};
function buildDots(){var box=document.getElementById("tdots");box.innerHTML="";THEMES.forEach(function(th){var b=document.createElement("button");b.className="tdot"+(S.theme===th?" sel":"");b.style.background=DOTC[th][0];b.setAttribute("aria-label",tx(th));b.setAttribute("aria-pressed",S.theme===th?"true":"false");b.innerHTML='<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="4" fill="'+DOTC[th][1]+'"/></svg>';b.onclick=function(){S.theme=th;save("theme",th);buildDots();};box.appendChild(b);});}
function buildCards(){var box=document.getElementById("cards");box.innerHTML="";THEMES.forEach(function(th){var b=document.createElement("button");b.className="card";b.setAttribute("aria-label",tx(th)+": "+tx(th+"L"));var c=document.createElement("canvas");b.appendChild(c);var n=document.createElement("span");n.textContent=tx(th);var l=document.createElement("small");l.textContent=tx(th+"L");b.appendChild(n);b.appendChild(l);b.onclick=function(){S.theme=th;save("theme",th);S.seen=true;save("seen",true);buildDots();show("dial");};box.appendChild(b);requestAnimationFrame(function(){thumb(c,th);});});}
function buildLangs(){var box=document.getElementById("langs");box.innerHTML="";LANGS.forEach(function(L){var b=document.createElement("button");b.className="lang"+(S.lang===L[0]?" sel":"");b.textContent=L[1];b.onclick=function(){S.lang=L[0];save("lang",L[0]);applyText();};box.appendChild(b);});}
document.getElementById("gear").onclick=function(){show("set");};
document.getElementById("closeSet").onclick=function(){show("dial");};
function bindToggle(id,key){var b=document.getElementById(id);b.setAttribute("aria-pressed",S[key]?"true":"false");b.onclick=function(){S[key]=!S[key];save(key,S[key]);b.setAttribute("aria-pressed",S[key]?"true":"false");};}
bindToggle("tSound","sound");bindToggle("tVib","vib");

// ---------- audio: the latch ----------
var AC=null,NB=null;
function audio(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();}if(AC.state==="suspended")AC.resume();}catch(e){AC=null;}return AC;}
function noiseBuf(){if(NB)return NB;var c=AC;NB=c.createBuffer(1,c.sampleRate,c.sampleRate);var d=NB.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;return NB;}
function burst(t,type,f,q,peak,dec){var c=AC,s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();s.buffer=noiseBuf();fl.type=type;fl.frequency.value=f;fl.Q.value=q;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+0.001);g.gain.exponentialRampToValueAtTime(0.0001,t+dec);s.connect(fl);fl.connect(g);g.connect(c.destination);s.start(t);s.stop(t+dec+0.05);}
function latch(){if(!S.sound)return;var c=audio();if(!c)return;var t=c.currentTime+0.02;burst(t,"bandpass",2600,3,0.6,0.036);burst(t+0.006,"lowpass",600,1,0.25,0.041);burst(t+0.13,"bandpass",1500,3,0.5,0.051);burst(t+0.136,"lowpass",400,1,0.3,0.061);}
function tap(){if(!S.vib)return;try{if(navigator.vibrate)navigator.vibrate([0,60]);}catch(e){}}

// ---------- wake lock ----------
var WL=null;

  var ev=eventPhase(t,5,80);if(ev.on){c.strokeStyle="rgba(242,233,220,0.35)";c.lineWidth=2*s;c.beginPath();var yl=H*(0.2+0.6*ev.k);c.moveTo(0,yl);c.bezierCurveTo(W*0.3,yl-60*s,W*0.7,yl+60*s,W,yl);c.stroke();}
};
function thumb(cv2,th){var r=cv2.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);cv2.width=r.width*d;cv2.height=r.height*d;var c=cv2.getContext("2d");var W=cv2.width,H=W*844/390;c.save();c.translate(0,-(H-cv2.height)/2);SCN[th](c,W,H,12,0.2,0,0);c.restore();}

// ---------- frame loop ----------
var last=performance.now(),animT=0;
function resize(){var d=Math.min(2,window.devicePixelRatio||1),r=app.getBoundingClientRect();cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);}
window.addEventListener("resize",resize);

var fpsT=0;
function frame(now){
  var dt=Math.min(0.1,(now-last)/1000);last=now;
  if(mode==="imm"||mode==="arr"){
    fpsT+=dt;
    if(fpsT>=1/30){
      var rem=sess?remaining():0,L=0,p=0;
      if(sess){p=sess.dur?elapsed()/sess.dur:1;L=mode==="arr"?1:Math.max(0,Math.min(1,1-rem/10000));}
      animT+=fpsT*(1-0.5*L);window.__odo=(window.__odo||0)+fpsT*60*(1-0.85*L);fpsT=0;
      var W=cv.width,H=cv.height;cx.clearRect(0,0,W,H);SCN[S.theme](cx,W,H,animT,p,sess?sess.view:0,L);
      if(mode==="imm"&&sess){
        var ready=swipesReady()>0;document.getElementById("hint").classList.toggle("on",ready&&rem>10000);
        if(ready&&rem>10000){var g=cx.createRadialGradient(W/2,H,0,W/2,H,W*0.7);g.addColorStop(0,"rgba(242,166,90,0.45)");g.addColorStop(1,"rgba(242,166,90,0)");cx.fillStyle=g;cx.fillRect(0,H*0.6,W,H*0.4);}
        if(rem<=0)finish();
        if(hashFast)dbg.textContent="TEST x10\nleft "+Math.ceil(rem/1000)+"s\npeeks "+sess.peeks+"  swipes "+sess.used+"\nready "+swipesReady();
      }
    }
  }
  requestAnimationFrame(frame);
}

// ---------- start ----------
resize();applyText();setMins(PRESETS.indexOf(S.mins)>=0?S.mins:10);
if(!S.seen){show("splash");var sp=document.getElementById("splash");var go=function(){if(mode==="splash")show("pick");};sp.onclick=go;setTimeout(go,5000);}else show("dial");
requestAnimationFrame(frame);
})();
</script>
